<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fitness App</title>
    <!-- PWA Basic -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fitness">
    <link rel="manifest" href="manifest.json">

    <!-- Bibliotheken lokal (kein Internet nötig) -->
    <script src="js/vendor/dexie.js"></script>
    <script src="js/vendor/chart.umd.min.js"></script>
    <script src="js/vendor/jspdf.umd.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1 id="page-title">Fitness</h1>
            <nav id="main-nav">
                <button class="nav-btn" data-page="home">🏠</button>
                <button class="nav-btn" data-page="training">🏋️ Heute</button>
                <button class="nav-btn" data-page="overview">📅 Übersicht</button>
                <button class="nav-btn" data-page="stats">📈 Entwicklung</button>
                <button class="nav-btn" data-page="admin">⚙️ Admin</button>
            </nav>
        </header>

        <main id="content">
            <!-- Dynamic Content -->
            <div id="home-screen" class="page active">
                <div class="hero-buttons">
                    <button class="hero-btn" data-page="training">
                        <span class="icon">🏋️</span>
                        <span class="label">Heutiges Training</span>
                    </button>
                    <button class="hero-btn" data-page="overview">
                        <span class="icon">📜</span>
                        <span class="label">Trainingsübersicht</span>
                    </button>
                    <button class="hero-btn" data-page="stats">
                        <span class="icon">📊</span>
                        <span class="label">Entwicklung Training</span>
                    </button>
                    <button class="hero-btn" data-page="admin">
                        <span class="icon">🛠️</span>
                        <span class="label">Admin</span>
                    </button>
                </div>
            </div>

            <!-- Page templates populated via JS -->
            <div id="training-page" class="page"></div>
            <div id="overview-page" class="page"></div>
            <div id="stats-page" class="page"></div>
            <div id="admin-page" class="page"></div>
        </main>

        <footer>
            <div class="footer-content">
                <span class="copyright">© 2026 Christian Schuster | Antigravity</span>
                <img src="logo_schousta.png" alt="Logo" class="footer-logo">
            </div>
        </footer>
    </div>

    <!-- Modals -->
    <div id="modal-container" class="hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button id="modal-close">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Service Worker nur registrieren wenn unterstützt
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('SW Fehler (ignorierbar):', err));
        }
    </script>
</body>
</html>
