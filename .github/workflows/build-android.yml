name: Android APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: APK erstellen
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm-Abhaengigkeiten installieren
        run: npm install

      - name: Bibliotheken nach www/js/vendor kopieren
        run: |
          mkdir -p www/js/vendor
          cp node_modules/dexie/dist/dexie.js www/js/vendor/dexie.js
          cp node_modules/chart.js/dist/chart.umd.min.js www/js/vendor/chart.umd.min.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/js/vendor/jspdf.umd.min.js

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK Komponenten installieren
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Capacitor Android-Plattform hinzufuegen
        run: npx cap add android

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: Gradle ausfuehrbar machen
        run: chmod +x android/gradlew

      - name: Debug-APK bauen
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Fitness-App-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
