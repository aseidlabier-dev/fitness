30: Android APK bauen

ein:
  drücken:
    Zweige: [ haupt, Meister ]
  Workflow_VersandWorkflow_Versand:

Jobs:
  Build-Android:
    Name: APK erstellen
    anläufe: Ubuntu-Neueste

    Schritte:
      - Name: Code Auschecken
        Verwendet: Aktionen/checkout@v4

      - Name: Node.js 20 Antigen
        Verwendet: Aktionen/setup-node@v4
        Mit:
          Knotenversion: '20'

      - Name: npm-Abhaengigkeit installieren
        laufen: npm installieren

      - Name: Bibliotheken nach www/js/vendor kopieren
        laufen: |
          mkdir -p www/js/vendor
          cp node_modules/dexie/dist/dexie.js www/js/vendor/dexie.js
          cp node_modules/chart.js/dist/chart.umd.min.js www/js/vendor/chart.umd.min.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/js/vendor/jspdf.umd.min.js

      - Name: Java 17 Antigen
        Verwendet: Aktionen/setup-java@v4
        Mit:
          Java-Version: '17'
          Verbindung: 'Temurin'

      - Name: Android SDK Komponenten installieren
        laufen: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "Plattform;android-34" "Build-Tools;34.0.0" "Plattform-Tools" || true

      - Name: Kondensator Android-Plattform hinzufuegen
        laufen: npx cap Android Hinzufügen

      - Name: Kondensatorsynchronisieren
        laufen: npx cap synchronisieren Android

      - Name: Gradle Ausfuehrbar Machen
        laufen: chmod +x android/gradlew

      - Name: Debug-APK bauen
        laufen: |
          CD Android
          ./gradlew assembleDebug --no-daemon --stacktrace
      

      - Name: APK als Artefakt hochladen
        Verwendet: Aktionen/upload-artifact@v4
        Mit:
          Name: Fitness-App-Android-APK
          Pfad: android/app/build/outputs/apk/debug/app-debug.apk
          Aufbauphase: 30
