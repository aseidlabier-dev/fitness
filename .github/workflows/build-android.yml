name: Fitness Android APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund fuer den Build'
        required: false
        default: 'Manueller Build'

jobs:
  build-android:
    name: APK erstellen
    runs-on: ubuntu-latest

    steps:
      # 1. Code laden
      - name: Code auschecken
        uses: actions/checkout@v4

      # 2. Node.js 20 einrichten
      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. npm-Pakete installieren (Capacitor + Bibliotheken)
      - name: npm-Abhaengigkeiten installieren
        run: npm install

      # 4. Bibliotheken lokal in www/js/vendor/ kopieren
      - name: Bibliotheken nach www/js/vendor kopieren
        run: |
          mkdir -p www/js/vendor
          cp node_modules/dexie/dist/dexie.js www/js/vendor/dexie.js
          cp node_modules/chart.js/dist/chart.umd.min.js www/js/vendor/chart.umd.min.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/js/vendor/jspdf.umd.min.js
          echo "Bibliotheken erfolgreich kopiert:"
          ls -lh www/js/vendor/

      # 5. Java 17 einrichten (benoetigt fuer Android-Build)
      - name: Java 17 (Temurin) einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 6. Android SDK sicherstellen
      - name: Android SDK Komponenten installieren
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Android SDK bereit."

      # 7. Android-Plattform zu Capacitor hinzufuegen
      - name: Capacitor Android-Plattform hinzufuegen
        run: npx cap add android

      # 8. Web-Assets in Android-Projekt synchronisieren
      - name: Capacitor synchronisieren
        run: npx cap sync android

      # 9. Eigenes App-Icon (icon.png) in alle Android-Aufloesungen einbinden
      - name: Eigenes App-Icon einbinden
        continue-on-error: true
        run: |
          python3 -m pip install Pillow --break-system-packages 2>/dev/null || python3 -m pip install Pillow || sudo apt-get install -y python3-pil 2>/dev/null || true
          python3 -c '
          import os
          try:
              from PIL import Image
              icon_src = "www/icon.png"
              if os.path.exists(icon_src):
                  im = Image.open(icon_src).convert("RGBA")
                  sizes = {
                      "mipmap-mdpi": (48, 108),
                      "mipmap-hdpi": (72, 162),
                      "mipmap-xhdpi": (96, 216),
                      "mipmap-xxhdpi": (144, 324),
                      "mipmap-xxxhdpi": (192, 432),
                  }
                  for folder, (size, fg_size) in sizes.items():
                      res_dir = os.path.join("android/app/src/main/res", folder)
                      os.makedirs(res_dir, exist_ok=True)
                      icon_resized = im.resize((size, size), Image.Resampling.LANCZOS)
                      icon_resized.save(os.path.join(res_dir, "ic_launcher.png"))
                      icon_resized.save(os.path.join(res_dir, "ic_launcher_round.png"))
                      fg = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
                      inner_size = int(fg_size * 0.72)
                      inner_im = im.resize((inner_size, inner_size), Image.Resampling.LANCZOS)
                      offset = (fg_size - inner_size) // 2
                      fg.paste(inner_im, (offset, offset), inner_im)
                      fg.save(os.path.join(res_dir, "ic_launcher_foreground.png"))
                  print("✅ Eigenes App-Icon erfolgreich in alle Android-Aufloesungen integriert!")
              else:
                  print("⚠️ www/icon.png nicht gefunden!")
          except Exception as e:
              print(f"⚠️ Icon-Generierung uebersprungen: {e}")
          '

      # 10. Ausfuehrungsrechte fuer Gradle & local.properties setzen
      - name: Gradle ausfuehrbar machen
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

      # 11. Debug-APK bauen
      - name: Debug-APK bauen
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 12. APK als Download-Artefakt bereitstellen (30 Tage verfuegbar)
      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Fitness-App-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 13. Zusammenfassung ausgeben
      - name: Build-Zusammenfassung
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "✅ APK erfolgreich erstellt!"
            echo "   Groesse: $SIZE"
            echo "   → Jetzt im Tab 'Actions' unter 'Artifacts' herunterladen"
          else
            echo "❌ APK wurde nicht gefunden!"
            exit 1
          fi
